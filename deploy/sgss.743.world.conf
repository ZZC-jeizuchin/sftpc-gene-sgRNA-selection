# sgss.743.world —— SFTPC sgRNA Designer 反向代理
# 放到 /www/server/panel/vhost/nginx/sgss.743.world.conf
# ⚠️ 宝塔面板建站时它会自己生成一份；这份是「不用面板、纯手工」时的版本
#
# 关键点：一次查询要 20 秒 ~ 5 分钟（两个网站都要排队计算），
#         proxy_read_timeout 必须给足，否则默认 60s 会把长查询切断。

server {
    listen 80;
    listen [::]:80;
    server_name sgss.743.world;

    # 申请 SSL 证书用的验证目录（宝塔自动申请时需要）
    include /www/server/panel/vhost/nginx/well-known/sgss.743.world.conf;

    # 只走 https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sgss.743.world;

    # ---------- SSL（宝塔申请证书后会自动写这两行）----------
    ssl_certificate     /www/server/panel/vhost/cert/sgss.743.world/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/sgss.743.world/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    access_log  /www/wwwlogs/sgss.743.world.log;
    error_log   /www/wwwlogs/sgss.743.world.error.log;

    client_max_body_size 10m;

    # 禁止访问敏感文件
    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|AGENT\.md) {
        return 404;
    }

    # ---------- 反代到本地 Python 服务 ----------
    location ^~ / {
        proxy_pass http://127.0.0.1:1146;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # ★★★ 长查询关键设置 ★★★
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        # 单条响应最大约 200 KB（312 条候选的 JSON），缓冲没问题
        proxy_buffering on;
        proxy_buffers 8 32k;
        proxy_buffer_size 64k;
    }
}
